spring.application.name=storrity

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=
# to access h2 console in browser: http://localhost:8080/h2-console

# Prevent Global Exceptions from Polluting All Endpoints
springdoc.override-with-generic-response=false
# to access Swagger UI in browser: http://localhost:8080/swagger-ui/index.html
# to access Swagger json in browser: http://localhost:8080/v3/api-docs
# to access Swagger yaml in browser: http://localhost:8080/v3/api-docs.yaml
# to generate client with OpenAPI Generator
# 1: install cli tool: npm install @openapitools/openapi-generator-cli -g
# 2: download api.yaml file
# 3: generate ts client: openapi-generator-cli generate -i api.yaml -g typescript-fetch -o ./generated-api
#    generate java client: openapi-generator-cli generate -i api.yaml -g java -o ./java-client


